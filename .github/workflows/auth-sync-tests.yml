name: Auth and sync safety

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  deterministic-auth-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:auth-sync
      - run: npm run typecheck

  local-supabase-rls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase start --exclude mailpit
      - name: Verify cross-user isolation against local Supabase only
        env:
          TRAINOS_TEST_SUPABASE_URL: http://127.0.0.1:54321
        run: npm run test:supabase:local
      - if: always()
        run: supabase stop --no-backup
